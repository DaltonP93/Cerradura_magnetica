name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff) — whole backend incl. migrations and alembic/env.py
        run: ruff check .
      - name: Tests (SQLite)
        run: pytest tests -q
      - name: Verify Alembic migrations apply
        run: ACP_DATABASE_URL=sqlite:////tmp/ci-migrate.db alembic upgrade head

  backend-postgres:
    # Certifies row-level locking behaviour (atomic refresh rotation under
    # concurrency) that SQLite cannot guarantee.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acptest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ACP_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/acptest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify Alembic migrations apply (PostgreSQL)
        run: alembic upgrade head
      - name: Tests (PostgreSQL)
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (typecheck + bundle)
        run: npm run build
