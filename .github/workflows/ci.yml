name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff) — whole backend incl. migrations and alembic/env.py
        run: ruff check .
      - name: Audit production dependencies (pip-audit)
        # Python counterpart of the frontend's `npm audit --omit=dev`: audits the
        # resolved production requirements against the PyPI advisory DB. Dev-only
        # tooling (pytest, ruff, pip-audit) is intentionally excluded.
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Verify a single Alembic head (no divergent branches)
        run: |
          heads=$(alembic heads | grep -c '(head)')
          echo "alembic heads: $heads"
          test "$heads" = "1"
      - name: Tests (SQLite)
        run: pytest tests -q
      - name: Verify Alembic migrations apply
        run: ACP_DATABASE_URL=sqlite:////tmp/ci-migrate.db alembic upgrade head

  backend-postgres:
    # Certifies row-level locking behaviour (atomic refresh rotation under
    # concurrency) that SQLite cannot guarantee.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acptest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ACP_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/acptest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify Alembic migrations apply (PostgreSQL)
        run: alembic upgrade head
      - name: Tests (PostgreSQL)
        run: pytest tests -q

  backup-restore-postgres:
    # Real, disposable PostgreSQL end-to-end test of scripts/backup_db.sh and
    # scripts/restore_db.sh (non-destructive swap + validation-abort safety),
    # not just the fake-`docker compose` unit tests.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ACP_PG_INTEGRATION: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install PostgreSQL client (psql + pg_dump) and ShellCheck
        run: sudo apt-get update && sudo apt-get install -y postgresql-client shellcheck
      - name: Lint shell scripts (sh -n + ShellCheck)
        working-directory: .
        run: |
          for f in scripts/*.sh scripts/ci/*.sh; do
            echo "== $f =="
            sh -n "$f"
            shellcheck "$f"
          done
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Real backup/restore end-to-end test
        run: pytest tests/test_backup_restore_integration.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Unit/component tests (vitest)
      - name: Audit dependencies (whole tree, incl. dev/tooling)
        # Fails on any high/critical advisory anywhere in the tree — dev/CI
        # included. Do not add an ignore/exception without documenting why.
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Build (typecheck + bundle)
        run: npm run build
