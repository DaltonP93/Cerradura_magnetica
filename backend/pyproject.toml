[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "UP042",  # keep (str, Enum): values serialize as plain strings in SQLAlchemy + Pydantic
]

[tool.ruff.lint.per-file-ignores]
# Alembic writes long, single-line Enum/DDL definitions that can't be wrapped
# without hand-editing generated code; length is not a real defect there.
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
