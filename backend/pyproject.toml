[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "UP042",  # keep (str, Enum): values serialize as plain strings in SQLAlchemy + Pydantic
]

[tool.pytest.ini_options]
testpaths = ["tests"]
